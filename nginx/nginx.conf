# ---------------------------------------------------------------------------
# onnx-inference gRPC gateway
#
# Clients connect to port 50050. NGINX routes by the gRPC HTTP/2 :path
# pseudo-header, which gRPC always sets to /<package>.<Service>/<Method>.
# No protobuf parsing required — routing is pure path prefix matching.
#
# Routing table:
#   /embedding.EmbeddingService/  →  bge-small-v15:50051
#   /tts.TTSService/              →  kokoro-82m-v1.0:50052
#   /ocr.OCRService/              →  rapid-pp-ocr-v4:50053
#   /llm.LLMService/              →  smollm2-360m:50054
#
# Port 8080 serves a plain HTTP /healthz endpoint used by Docker HEALTHCHECK.
# ---------------------------------------------------------------------------

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------------------------
    # gRPC gateway — port 50050
    # ------------------------------------------------------------------
    server {
        listen 50050;
        http2 on;

        # Sensible global defaults. Individual services override where needed.
        grpc_connect_timeout  10s;
        grpc_read_timeout     30s;
        grpc_send_timeout     30s;
        grpc_buffer_size      32k;
        client_max_body_size  0;

        # Embedding — bge-small-v15
        location /embedding.EmbeddingService/ {
            grpc_pass grpc://bge-small-v15:50051;
        }

        # TTS — kokoro-82m-v1.0
        # Audio generation can be slow; raise read/send to 60 s.
        location /tts.TTSService/ {
            grpc_pass         grpc://kokoro-82m-v1.0:50052;
            grpc_read_timeout 240s;
            grpc_send_timeout 240s;
        }

        # OCR — rapid-pp-ocr-v4
        location /ocr.OCRService/ {
            grpc_pass grpc://rapid-pp-ocr-v4:50053;
        }

        # LLM — smollm2-360m
        # Token generation can run long for large outputs.
        location /llm.LLMService/ {
            grpc_pass         grpc://smollm2-360m:50054;
            grpc_read_timeout 120s;
            grpc_send_timeout 120s;
        }

        # Return a proper gRPC UNIMPLEMENTED status for unknown paths.
        location / {
            return 404;
        }
    }

    # ------------------------------------------------------------------
    # Health endpoint — port 8080 (used by Docker HEALTHCHECK)
    # ------------------------------------------------------------------
    server {
        listen 8080;

        location /healthz {
            return 200 'ok\n';
            add_header Content-Type text/plain;
        }
    }
}
